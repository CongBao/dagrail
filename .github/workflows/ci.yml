name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go build -trimpath ./cmd/dagrail
        env:
          CGO_ENABLED: '0'

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: darwin, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: windows, goarch: amd64, ext: '.exe', archive: zip}
          - {goos: windows, goarch: arm64, ext: '.exe', archive: zip}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
      - name: Build deterministic release candidate
        shell: bash
        run: |
          version=$(sed -n 's/[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          epoch=$(git show -s --format=%ct HEAD)
          build_date=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)
          flags="-buildid= -s -w -X github.com/CongBao/dagrail/internal/version.Version=${version} -X github.com/CongBao/dagrail/internal/version.Commit=${GITHUB_SHA} -X github.com/CongBao/dagrail/internal/version.Date=${build_date}"
          mkdir -p stage package
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildvcs=false -trimpath -ldflags "$flags" \
            -o "stage/dagrail${{ matrix.ext }}" ./cmd/dagrail
          cp "stage/dagrail${{ matrix.ext }}" LICENSE README.md package/
          find package -exec touch -h -d "@${epoch}" {} +
          asset="dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          if [ '${{ matrix.archive }}' = zip ]; then
            (cd package && TZ=UTC zip -X -q "../${asset}" LICENSE README.md dagrail${{ matrix.ext }})
          else
            tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
              -C package -cf - LICENSE README.md dagrail${{ matrix.ext }} | gzip -n > "$asset"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: stage/dagrail${{ matrix.ext }}
          format: spdx-json
          output-file: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rehearsal-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json

  release-artifact-rehearsal:
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-rehearsal-*
          merge-multiple: true
          path: dist
      - name: Rehearse closed release manifest
        shell: bash
        run: |
          (cd dist && find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > checksums.txt)
          version=$(sed -n 's/[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          epoch=$(git show -s --format=%ct HEAD)
          go run ./cmd/dagrail release manifest --directory dist \
            --version "$version" --tag "v${version}" --commit "$GITHUB_SHA" \
            --source-date-epoch "$epoch"
          go run ./cmd/dagrail release verify --directory dist

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
      - run: go test ./internal/journal -run RFC8785
      - run: go test ./internal/mcpserver -run TestServerExposesOnlySixHighLevelTypedTools
      - run: go vet ./...
      - name: Verify structural release qualification
        run: go run ./cmd/dagrail qualify release --source .
      - name: Verify reproducible linked binary
        shell: bash
        run: |
          version=$(sed -n 's/[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          epoch=$(git show -s --format=%ct HEAD)
          build_date=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)
          flags="-buildid= -s -w -X github.com/CongBao/dagrail/internal/version.Version=${version} -X github.com/CongBao/dagrail/internal/version.Commit=${GITHUB_SHA} -X github.com/CongBao/dagrail/internal/version.Date=${build_date}"
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "$flags" -o /tmp/dagrail-build-a ./cmd/dagrail
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "$flags" -o /tmp/dagrail-build-b ./cmd/dagrail
          cmp /tmp/dagrail-build-a /tmp/dagrail-build-b
          for suffix in a b; do
            package="/tmp/dagrail-package-$suffix"
            mkdir -p "$package"
            cp "/tmp/dagrail-build-$suffix" "$package/dagrail"
            cp LICENSE README.md "$package/"
            find "$package" -exec touch -h -d "@${epoch}" {} +
            tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
              -C "$package" -cf - LICENSE README.md dagrail | gzip -n > "/tmp/dagrail-$suffix.tar.gz"
          done
          cmp /tmp/dagrail-a.tar.gz /tmp/dagrail-b.tar.gz

  historical-binary-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build and traverse the beta compatibility window
        run: go test -tags=historical ./internal/install -run '^TestHistoricalBinaryCompatibilityWindow$' -count=1 -timeout=18m

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: ./internal/domain, fuzz: FuzzValidateGraphJSON}
          - {package: ./internal/journal, fuzz: FuzzValidateSegments}
          - {package: ./internal/service, fuzz: FuzzDecodeGraphDefinition}
          - {package: ./internal/service, fuzz: FuzzDecodeGraphPatch}
          - {package: ./internal/service, fuzz: FuzzDecodeLifecycleMigrationAuthority}
          - {package: ./internal/harness, fuzz: FuzzNativeReceiptConformance}
          - {package: ./internal/release, fuzz: FuzzReleaseMetadataInputs}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run bounded fuzz target
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.fuzz }}$' -fuzztime=5s

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Reject reachable known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Reject forbidden or unknown dependency licenses
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/dagrail --disallowed_types=forbidden,unknown
