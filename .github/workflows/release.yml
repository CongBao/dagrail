name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go test -race ./...
      - run: go vet ./...
      - name: Run bounded fuzz qualification
        shell: bash
        run: |
          go test ./internal/domain -run '^$' -fuzz '^FuzzValidateGraphJSON$' -fuzztime=5s
          go test ./internal/journal -run '^$' -fuzz '^FuzzValidateSegments$' -fuzztime=5s
          go test ./internal/service -run '^$' -fuzz '^FuzzDecodeGraphDefinition$' -fuzztime=5s
          go test ./internal/service -run '^$' -fuzz '^FuzzDecodeGraphPatch$' -fuzztime=5s
          go test ./internal/service -run '^$' -fuzz '^FuzzDecodeLifecycleMigrationAuthority$' -fuzztime=5s
          go test ./internal/harness -run '^$' -fuzz '^FuzzNativeReceiptConformance$' -fuzztime=5s
          go test ./internal/release -run '^$' -fuzz '^FuzzReleaseMetadataInputs$' -fuzztime=5s
          go test ./internal/gitartifact -run '^$' -fuzz '^FuzzDecodeClosureManifest$' -fuzztime=5s
      - name: Verify structural release qualification
        run: go run ./cmd/dagrail qualify release --source .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/dagrail --disallowed_types=forbidden,unknown

  historical-binary-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build and traverse the beta compatibility window
        run: go test -tags=historical ./internal/install -run '^TestHistoricalBinaryCompatibilityWindow$' -count=1 -timeout=18m

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: darwin, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: windows, goarch: amd64, ext: '.exe', archive: zip}
          - {goos: windows, goarch: arm64, ext: '.exe', archive: zip}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Validate release metadata
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          source_version=$(sed -n 's/[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          test "$version" = "$source_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build twice and compare
        shell: bash
        run: |
          mkdir -p stage-a stage-b package
          flags="-buildid= -s -w -X github.com/CongBao/dagrail/internal/version.Version=${VERSION} -X github.com/CongBao/dagrail/internal/version.Commit=${GITHUB_SHA} -X github.com/CongBao/dagrail/internal/version.Date=${BUILD_DATE}"
          for stage in stage-a stage-b; do
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -buildvcs=false -trimpath -ldflags "$flags" \
              -o "$stage/dagrail${{ matrix.ext }}" ./cmd/dagrail
          done
          cmp stage-a/dagrail${{ matrix.ext }} stage-b/dagrail${{ matrix.ext }}
          cp stage-a/dagrail${{ matrix.ext }} LICENSE README.md package/
      - name: Create deterministic archive
        shell: bash
        run: |
          find package -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          asset="dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          if [ '${{ matrix.archive }}' = zip ]; then
            (cd package && TZ=UTC zip -X -q "../${asset}" LICENSE README.md dagrail${{ matrix.ext }})
          else
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
              -C package -cf - LICENSE README.md dagrail${{ matrix.ext }} | gzip -n > "$asset"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: stage-a/dagrail${{ matrix.ext }}
          format: spdx-json
          output-file: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            ${{ env.ASSET }}
            dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dagrail-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json

  publish:
    needs: [build, qualification, security, historical-binary-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dagrail-*
          merge-multiple: true
          path: dist
      - name: Create sorted checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum > checksums.txt
      - name: Create and verify closed release manifest
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          go run ./cmd/dagrail release manifest --directory dist \
            --version "$version" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --source-date-epoch "$epoch"
          go run ./cmd/dagrail release verify --directory dist
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/checksums.txt
            dist/release-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
