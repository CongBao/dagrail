name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: darwin, goarch: amd64, ext: ''}
          - {goos: darwin, goarch: arm64, ext: ''}
          - {goos: linux, goarch: amd64, ext: ''}
          - {goos: linux, goarch: arm64, ext: ''}
          - {goos: windows, goarch: amd64, ext: '.exe'}
          - {goos: windows, goarch: arm64, ext: '.exe'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build
        shell: bash
        run: |
          mkdir -p stage
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X github.com/CongBao/dagrail/internal/version.Version=${GITHUB_REF_NAME#v} -X github.com/CongBao/dagrail/internal/version.Commit=${GITHUB_SHA} -X github.com/CongBao/dagrail/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o stage/dagrail${{ matrix.ext }} ./cmd/dagrail
          cp LICENSE README.md stage/
          if [ '${{ matrix.goos }}' = windows ]; then
            (cd stage && zip -q ../dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.zip *)
          else
            tar -C stage -czf dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz .
          fi
      - uses: anchore/sbom-action@v0
        with:
          path: stage/dagrail${{ matrix.ext }}
          format: spdx-json
          output-file: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: dagrail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dagrail-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
