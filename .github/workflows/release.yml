name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: darwin, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: amd64, ext: '', archive: tar.gz}
          - {goos: linux, goarch: arm64, ext: '', archive: tar.gz}
          - {goos: windows, goarch: amd64, ext: '.exe', archive: zip}
          - {goos: windows, goarch: arm64, ext: '.exe', archive: zip}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate release metadata
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          source_version=$(sed -n 's/[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/version/version.go)
          test "$version" = "$source_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build twice and compare
        shell: bash
        run: |
          mkdir -p stage-a stage-b package
          flags="-buildid= -s -w -X github.com/CongBao/dagrail/internal/version.Version=${VERSION} -X github.com/CongBao/dagrail/internal/version.Commit=${GITHUB_SHA} -X github.com/CongBao/dagrail/internal/version.Date=${BUILD_DATE}"
          for stage in stage-a stage-b; do
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -buildvcs=false -trimpath -ldflags "$flags" \
              -o "$stage/dagrail${{ matrix.ext }}" ./cmd/dagrail
          done
          cmp stage-a/dagrail${{ matrix.ext }} stage-b/dagrail${{ matrix.ext }}
          cp stage-a/dagrail${{ matrix.ext }} LICENSE README.md package/
      - name: Create deterministic archive
        shell: bash
        run: |
          find package -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          asset="dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          if [ '${{ matrix.archive }}' = zip ]; then
            (cd package && TZ=UTC zip -X -q "../${asset}" LICENSE README.md dagrail${{ matrix.ext }})
          else
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
              -C package -cf - LICENSE README.md dagrail${{ matrix.ext }} | gzip -n > "$asset"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: stage-a/dagrail${{ matrix.ext }}
          format: spdx-json
          output-file: dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.ASSET }}
            dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagrail-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            dagrail_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dagrail-*
          merge-multiple: true
          path: dist
      - name: Create sorted checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum > checksums.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
